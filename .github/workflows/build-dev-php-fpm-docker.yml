name: Build development 8.6 php-fpm Docker (manual)

# Cost control: image publish only from openemr/openemr master.
# This fork's scheduled Nightly builds were dry-run failures (Actions cost).
# Manual workflow_dispatch remains available if needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PUSH_IMAGE: ${{ github.repository == 'openemr/openemr' && github.ref == 'refs/heads/master' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to Docker Hub
      if: env.PUSH_IMAGE == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build (and push on master) dev-php-fpm:pre-build-dev-86 docker
      uses: docker/build-push-action@v7
      with:
        context: ./docker/library/dockers/dev-php-fpm
        tags: openemr/dev-php-fpm:pre-build-dev-86
        platforms: linux/amd64
        push: ${{ env.PUSH_IMAGE == 'true' }}
        no-cache: true
